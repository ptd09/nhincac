<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chó Quỳnh Thư</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .text {
      margin-top: max(70px, env(safe-area-inset-top));
      color: white;
      font-size: clamp(42px, 12vw, 90px);
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      padding: 20px;
      text-shadow: 0 0 20px rgba(255,255,255,0.8);
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="text">
    CHÓ QUỲNH THƯ
  </div>
</body>
</html>
